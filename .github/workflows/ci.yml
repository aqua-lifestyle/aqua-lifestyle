name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  release-safety:
    name: Release safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test qualification, admission, provider failures and retry boundaries
        run: node tools/deployment/run-security-tests.mjs
      - name: Retain exact mandatory case evidence
        uses: actions/upload-artifact@v6
        with:
          name: mandatory-security-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/mandatory-security/report.json
          if-no-files-found: error
          retention-days: 90

  backend-application-discovery:
    name: Backend application coverage partition
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: AqualLifeStyle/9.4.2/aspnet-core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore test/AqualLifeStyle.Tests/AqualLifeStyle.Tests.csproj -p:Configuration=Release
      - name: Build
        run: dotnet build test/AqualLifeStyle.Tests/AqualLifeStyle.Tests.csproj --configuration Release --no-restore
      - name: Prove complete application coverage partition
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p TestResults/partition
          discover() {
            local shard="$1"
            shift
            dotnet test test/AqualLifeStyle.Tests/AqualLifeStyle.Tests.csproj \
              --configuration Release --no-build --list-tests "$@" \
              2>&1 | tee "TestResults/partition/${shard}-discovery.txt"
            awk '
              /^The following Tests are available:\r?$/ { found=1; next }
              found && /^    / { sub(/^    /, ""); sub(/\r$/, ""); print }
            ' "TestResults/partition/${shard}-discovery.txt" \
              | sort > "TestResults/partition/${shard}-names.txt"
            test -s "TestResults/partition/${shard}-names.txt"
          }
          discover all
          discover application-administration --filter 'FullyQualifiedName~AqualLifeStyle.Tests.Application.Admin&FullyQualifiedName!~AqualLifeStyle.Tests.Application.AdminProgramme'
          discover application-membership --filter 'FullyQualifiedName~AqualLifeStyle.Tests.Application.&(FullyQualifiedName~AqualLifeStyle.Tests.Application.AdminProgramme|FullyQualifiedName~AqualLifeStyle.Tests.Application.ClubMember)'
          discover application-authentication --filter 'FullyQualifiedName~AqualLifeStyle.Tests.Application.&FullyQualifiedName!~AqualLifeStyle.Tests.Application.Admin&FullyQualifiedName!~AqualLifeStyle.Tests.Application.ClubMember&(FullyQualifiedName~Account|FullyQualifiedName~Authorization|FullyQualifiedName~User|FullyQualifiedName~Role)'
          discover application-remainder --filter 'FullyQualifiedName~AqualLifeStyle.Tests.Application.&FullyQualifiedName!~AqualLifeStyle.Tests.Application.Admin&FullyQualifiedName!~AqualLifeStyle.Tests.Application.ClubMember&FullyQualifiedName!~Account&FullyQualifiedName!~Authorization&FullyQualifiedName!~User&FullyQualifiedName!~Role'
          discover entity-framework-migrations --filter 'FullyQualifiedName~AqualLifeStyle.Tests.EntityFrameworkCore.&FullyQualifiedName~Migration'
          discover entity-framework-placement --filter 'FullyQualifiedName~AqualLifeStyle.Tests.EntityFrameworkCore.&FullyQualifiedName!~Migration&(FullyQualifiedName~AQGreenPlacement|FullyQualifiedName~AQGreenStructural)'
          discover entity-framework-remainder --filter 'FullyQualifiedName~AqualLifeStyle.Tests.EntityFrameworkCore.&FullyQualifiedName!~Migration&FullyQualifiedName!~AQGreenPlacement&FullyQualifiedName!~AQGreenStructural'
          discover remainder --filter 'FullyQualifiedName!~AqualLifeStyle.Tests.Application.&FullyQualifiedName!~AqualLifeStyle.Tests.EntityFrameworkCore.'
          cat TestResults/partition/{application-administration,application-membership,application-authentication,application-remainder,entity-framework-migrations,entity-framework-placement,entity-framework-remainder,remainder}-names.txt \
            | sort > TestResults/partition/union-names.txt
          diff -u TestResults/partition/{all,union}-names.txt \
            | tee TestResults/partition/multiset-diff.txt
          for shard in all application-administration application-membership application-authentication application-remainder entity-framework-migrations entity-framework-placement entity-framework-remainder remainder; do
            printf '%s: %s\n' "$shard" "$(wc -l < "TestResults/partition/${shard}-names.txt")"
          done | tee TestResults/partition/counts.txt
          printf 'PASS: full inventory equals shard union as multisets.\n' \
            | tee TestResults/partition/coverage-result.txt
      - name: Upload application coverage partition
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-application-coverage-partition
          path: AqualLifeStyle/9.4.2/aspnet-core/TestResults/partition
          if-no-files-found: error
          retention-days: 7

  backend-application-tests:
    name: Backend application tests (${{ matrix.shard }})
    needs: backend-application-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: application-administration
            filter: FullyQualifiedName~AqualLifeStyle.Tests.Application.Admin&FullyQualifiedName!~AqualLifeStyle.Tests.Application.AdminProgramme
          - shard: application-membership
            filter: FullyQualifiedName~AqualLifeStyle.Tests.Application.&(FullyQualifiedName~AqualLifeStyle.Tests.Application.AdminProgramme|FullyQualifiedName~AqualLifeStyle.Tests.Application.ClubMember)
          - shard: application-authentication
            filter: FullyQualifiedName~AqualLifeStyle.Tests.Application.&FullyQualifiedName!~AqualLifeStyle.Tests.Application.Admin&FullyQualifiedName!~AqualLifeStyle.Tests.Application.ClubMember&(FullyQualifiedName~Account|FullyQualifiedName~Authorization|FullyQualifiedName~User|FullyQualifiedName~Role)
          - shard: application-remainder
            filter: FullyQualifiedName~AqualLifeStyle.Tests.Application.&FullyQualifiedName!~AqualLifeStyle.Tests.Application.Admin&FullyQualifiedName!~AqualLifeStyle.Tests.Application.ClubMember&FullyQualifiedName!~Account&FullyQualifiedName!~Authorization&FullyQualifiedName!~User&FullyQualifiedName!~Role
          - shard: entity-framework-migrations
            filter: FullyQualifiedName~AqualLifeStyle.Tests.EntityFrameworkCore.&FullyQualifiedName~Migration
          - shard: entity-framework-placement
            filter: FullyQualifiedName~AqualLifeStyle.Tests.EntityFrameworkCore.&FullyQualifiedName!~Migration&(FullyQualifiedName~AQGreenPlacement|FullyQualifiedName~AQGreenStructural)
          - shard: entity-framework-remainder
            filter: FullyQualifiedName~AqualLifeStyle.Tests.EntityFrameworkCore.&FullyQualifiedName!~Migration&FullyQualifiedName!~AQGreenPlacement&FullyQualifiedName!~AQGreenStructural
          - shard: remainder
            filter: FullyQualifiedName!~AqualLifeStyle.Tests.Application.&FullyQualifiedName!~AqualLifeStyle.Tests.EntityFrameworkCore.
    defaults:
      run:
        working-directory: AqualLifeStyle/9.4.2/aspnet-core
    env:
      SHARD: ${{ matrix.shard }}
      TEST_FILTER: ${{ matrix.filter }}
      RESULTS_DIR: TestResults/${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v7
        with:
          name: backend-application-coverage-partition
          path: AqualLifeStyle/9.4.2/aspnet-core/TestResults/partition
      - name: Restore
        run: dotnet restore test/AqualLifeStyle.Tests/AqualLifeStyle.Tests.csproj -p:Configuration=Release
      - name: Build
        run: dotnet build test/AqualLifeStyle.Tests/AqualLifeStyle.Tests.csproj --configuration Release --no-restore
      - name: Verify local shard discovery
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p "$RESULTS_DIR"
          dotnet test test/AqualLifeStyle.Tests/AqualLifeStyle.Tests.csproj \
            --configuration Release --no-build --list-tests --filter "$TEST_FILTER" \
            2>&1 | tee "$RESULTS_DIR/discovered-tests.txt"
          awk '
            /^The following Tests are available:\r?$/ { found=1; next }
            found && /^    / { sub(/^    /, ""); sub(/\r$/, ""); print }
          ' "$RESULTS_DIR/discovered-tests.txt" | sort > "$RESULTS_DIR/expected-names.txt"
          test -s "$RESULTS_DIR/expected-names.txt"
          diff -u "TestResults/partition/${SHARD}-names.txt" "$RESULTS_DIR/expected-names.txt" \
            | tee "$RESULTS_DIR/discovery-diff.txt"
      - name: Prepare Redis image for recovery-host test
        if: matrix.shard == 'entity-framework-migrations'
        run: |
          set -euo pipefail
          docker pull redis:7-alpine
          docker image inspect redis:7-alpine --format '{{.Id}}'
      - name: Test complete application shard
        run: |
          set -euo pipefail
          dotnet test test/AqualLifeStyle.Tests/AqualLifeStyle.Tests.csproj \
            --configuration Release --no-build --filter "$TEST_FILTER" \
            --logger "trx;LogFileName=${SHARD}-tests.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory "$RESULTS_DIR" \
            --diag "$RESULTS_DIR/vstest-diag.log" \
            --blame-hang \
            --blame-hang-timeout 5m \
            --blame-hang-dump-type none \
            2>&1 | tee "$RESULTS_DIR/application-console.log"
      - name: Verify complete shard results
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = [string[]][System.IO.File]::ReadAllLines((Join-Path $env:RESULTS_DIR 'expected-names.txt'))
          if ($expected.Count -eq 0) { throw 'Empty shard inventory' }
          $settings = [System.Xml.XmlReaderSettings]::new()
          $settings.DtdProcessing = [System.Xml.DtdProcessing]::Prohibit
          $reader = [System.Xml.XmlReader]::Create((Join-Path $env:RESULTS_DIR "$($env:SHARD)-tests.trx"), $settings)
          $trx = [System.Xml.XmlDocument]::new()
          try { $trx.Load($reader) } finally { $reader.Dispose() }
          $results = @($trx.SelectNodes("/*[local-name()='TestRun']/*[local-name()='Results']/*[local-name()='UnitTestResult']"))
          $actual = [string[]]@($results | ForEach-Object { $_.GetAttribute('testName') })
          [Array]::Sort($expected, [StringComparer]::Ordinal)
          [Array]::Sort($actual, [StringComparer]::Ordinal)
          if ($expected.Count -ne $actual.Count) { throw 'Shard result count does not match discovery' }
          for ($i = 0; $i -lt $expected.Count; $i++) {
            if (-not [StringComparer]::Ordinal.Equals($expected[$i], $actual[$i])) {
              throw "Shard result identity mismatch at index $i"
            }
          }
          $passed = @($results | Where-Object { $_.GetAttribute('outcome') -eq 'Passed' }).Count
          $failed = @($results | Where-Object { $_.GetAttribute('outcome') -eq 'Failed' }).Count
          $skipped = @($results | Where-Object { $_.GetAttribute('outcome') -eq 'NotExecuted' }).Count
          $summary = $trx.SelectSingleNode("/*[local-name()='TestRun']/*[local-name()='ResultSummary']")
          $counters = $summary.SelectSingleNode("*[local-name()='Counters']")
          if ($summary.GetAttribute('outcome') -ne 'Completed' -or $failed -ne 0 -or
              ($passed + $failed + $skipped) -ne $actual.Count -or
              [int]$counters.GetAttribute('total') -ne $actual.Count -or
              [int]$counters.GetAttribute('executed') -ne ($passed + $failed) -or
              [int]$counters.GetAttribute('passed') -ne $passed -or
              [int]$counters.GetAttribute('failed') -ne $failed -or
              [int]$counters.GetAttribute('notExecuted') -ne $skipped) {
            throw 'Failed, incomplete or inconsistent shard results'
          }
          $report = [ordered]@{ shard=$env:SHARD; expected=$expected.Count; results=$actual.Count; executed=($passed + $failed); passed=$passed; failed=$failed; skipped=$skipped; multisetEqual=$true }
          $report | ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:RESULTS_DIR 'result-completeness.json')
          $results | Where-Object { $_.GetAttribute('outcome') -eq 'NotExecuted' } | ForEach-Object { "SKIPPED: $($_.GetAttribute('testName'))" }
      - name: Upload application shard results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-application-${{ matrix.shard }}-results
          path: AqualLifeStyle/9.4.2/aspnet-core/TestResults/${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  backend-web-discovery:
    name: Backend web coverage partition
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASPNETCORE_ENVIRONMENT: Development
    defaults:
      run:
        working-directory: AqualLifeStyle/9.4.2/aspnet-core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj -p:Configuration=Release
      - name: Build
        run: dotnet build test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj --configuration Release --no-restore
      - name: Prove complete web coverage partition
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p TestResults/partition
          discover() {
            local shard="$1"
            shift
            dotnet test test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj \
              --configuration Release --no-build --list-tests "$@" \
              2>&1 | tee "TestResults/partition/${shard}-discovery.txt"
            awk '
              /^The following Tests are available:\r?$/ { found=1; next }
              found && /^    / { sub(/^    /, ""); sub(/\r$/, ""); print }
            ' "TestResults/partition/${shard}-discovery.txt" \
              | sort > "TestResults/partition/${shard}-names.txt"
            test -s "TestResults/partition/${shard}-names.txt"
          }
          discover all
          discover placement --filter 'FullyQualifiedName~AqualLifeStyle.Web.Tests.Integration.AQGreenPlacementV2ApprovalPostgreSqlTests'
          discover controllers --filter 'FullyQualifiedName~AqualLifeStyle.Web.Tests.Controllers.'
          discover remainder --filter 'FullyQualifiedName!~AqualLifeStyle.Web.Tests.Integration.AQGreenPlacementV2ApprovalPostgreSqlTests&FullyQualifiedName!~AqualLifeStyle.Web.Tests.Controllers.'
          cat TestResults/partition/{placement,controllers,remainder}-names.txt \
            | sort > TestResults/partition/union-names.txt
          diff -u TestResults/partition/{all,union}-names.txt \
            | tee TestResults/partition/multiset-diff.txt
          for shard in all placement controllers remainder; do
            printf '%s: %s\n' "$shard" "$(wc -l < "TestResults/partition/${shard}-names.txt")"
          done | tee TestResults/partition/counts.txt
          printf 'PASS: full inventory equals shard union as multisets.\n' \
            | tee TestResults/partition/coverage-result.txt
      - name: Upload web coverage partition
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-web-coverage-partition
          path: AqualLifeStyle/9.4.2/aspnet-core/TestResults/partition
          if-no-files-found: error
          retention-days: 7

  backend-web-tests:
    name: Backend web tests (${{ matrix.shard }})
    needs: backend-web-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: placement
            filter: FullyQualifiedName~AqualLifeStyle.Web.Tests.Integration.AQGreenPlacementV2ApprovalPostgreSqlTests
          - shard: controllers
            filter: FullyQualifiedName~AqualLifeStyle.Web.Tests.Controllers.
          - shard: remainder
            filter: FullyQualifiedName!~AqualLifeStyle.Web.Tests.Integration.AQGreenPlacementV2ApprovalPostgreSqlTests&FullyQualifiedName!~AqualLifeStyle.Web.Tests.Controllers.
    defaults:
      run:
        working-directory: AqualLifeStyle/9.4.2/aspnet-core
    env:
      ASPNETCORE_ENVIRONMENT: Development
      SHARD: ${{ matrix.shard }}
      TEST_FILTER: ${{ matrix.filter }}
      RESULTS_DIR: TestResults/${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v7
        with:
          name: backend-web-coverage-partition
          path: AqualLifeStyle/9.4.2/aspnet-core/TestResults/partition
      - name: Restore
        run: dotnet restore test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj -p:Configuration=Release
      - name: Build
        run: dotnet build test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj --configuration Release --no-restore
      - name: Verify local shard discovery
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p "$RESULTS_DIR"
          dotnet test test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj \
            --configuration Release --no-build --list-tests --filter "$TEST_FILTER" \
            2>&1 | tee "$RESULTS_DIR/discovered-tests.txt"
          awk '
            /^The following Tests are available:\r?$/ { found=1; next }
            found && /^    / { sub(/^    /, ""); sub(/\r$/, ""); print }
          ' "$RESULTS_DIR/discovered-tests.txt" | sort > "$RESULTS_DIR/expected-names.txt"
          test -s "$RESULTS_DIR/expected-names.txt"
          diff -u "TestResults/partition/${SHARD}-names.txt" "$RESULTS_DIR/expected-names.txt" \
            | tee "$RESULTS_DIR/discovery-diff.txt"
      - name: Test complete web shard
        run: |
          set -euo pipefail
          dotnet test test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj \
            --configuration Release --no-build --filter "$TEST_FILTER" \
            --logger "trx;LogFileName=${SHARD}-tests.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory "$RESULTS_DIR" \
            --diag "$RESULTS_DIR/vstest-diag.log" \
            --blame-hang \
            --blame-hang-timeout 5m \
            --blame-hang-dump-type none \
            2>&1 | tee "$RESULTS_DIR/web-console.log"
      - name: Verify complete shard results
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = [string[]][System.IO.File]::ReadAllLines((Join-Path $env:RESULTS_DIR 'expected-names.txt'))
          if ($expected.Count -eq 0) { throw 'Empty shard inventory' }
          $settings = [System.Xml.XmlReaderSettings]::new()
          $settings.DtdProcessing = [System.Xml.DtdProcessing]::Prohibit
          $reader = [System.Xml.XmlReader]::Create((Join-Path $env:RESULTS_DIR "$($env:SHARD)-tests.trx"), $settings)
          $trx = [System.Xml.XmlDocument]::new()
          try { $trx.Load($reader) } finally { $reader.Dispose() }
          $results = @($trx.SelectNodes("/*[local-name()='TestRun']/*[local-name()='Results']/*[local-name()='UnitTestResult']"))
          $actual = [string[]]@($results | ForEach-Object { $_.GetAttribute('testName') })
          [Array]::Sort($expected, [StringComparer]::Ordinal)
          [Array]::Sort($actual, [StringComparer]::Ordinal)
          if ($expected.Count -ne $actual.Count) { throw 'Shard result count does not match discovery' }
          for ($i = 0; $i -lt $expected.Count; $i++) {
            if (-not [StringComparer]::Ordinal.Equals($expected[$i], $actual[$i])) {
              throw "Shard result identity mismatch at index $i"
            }
          }
          $passed = @($results | Where-Object { $_.GetAttribute('outcome') -eq 'Passed' }).Count
          $failed = @($results | Where-Object { $_.GetAttribute('outcome') -eq 'Failed' }).Count
          $skipped = @($results | Where-Object { $_.GetAttribute('outcome') -eq 'NotExecuted' }).Count
          $summary = $trx.SelectSingleNode("/*[local-name()='TestRun']/*[local-name()='ResultSummary']")
          $counters = $summary.SelectSingleNode("*[local-name()='Counters']")
          # VSTest/xUnit TRX can leave notExecuted=0 for explicit skipped records.
          # Require the complete per-case multiset and total/executed gap instead;
          # accept only zero or the exact skip count in that redundant counter.
          if ($summary.GetAttribute('outcome') -ne 'Completed' -or $failed -ne 0 -or
              ($passed + $failed + $skipped) -ne $actual.Count -or
              [int]$counters.GetAttribute('total') -ne $actual.Count -or
              [int]$counters.GetAttribute('executed') -ne ($passed + $failed) -or
              [int]$counters.GetAttribute('passed') -ne $passed -or
              [int]$counters.GetAttribute('failed') -ne $failed -or
              ([int]$counters.GetAttribute('total') - [int]$counters.GetAttribute('executed')) -ne $skipped -or
              ([int]$counters.GetAttribute('notExecuted') -ne 0 -and
               [int]$counters.GetAttribute('notExecuted') -ne $skipped)) {
            throw 'Failed, incomplete or inconsistent shard results'
          }
          $report = [ordered]@{ shard=$env:SHARD; expected=$expected.Count; results=$actual.Count; executed=($passed + $failed); passed=$passed; failed=$failed; skipped=$skipped; multisetEqual=$true }
          $report | ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:RESULTS_DIR 'result-completeness.json')
          $results | Where-Object { $_.GetAttribute('outcome') -eq 'NotExecuted' } | ForEach-Object { "SKIPPED: $($_.GetAttribute('testName'))" }
      - name: Upload web shard results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-web-${{ matrix.shard }}-results
          path: AqualLifeStyle/9.4.2/aspnet-core/TestResults/${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AqualLifeStyle/9.4.2/aqua-frontend
    env:
      NEXT_PUBLIC_ABP_API_URL: https://api.example.test
      NEXT_PUBLIC_DEFAULT_TENANT_NAME: Default
      NEXTAUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AqualLifeStyle/9.4.2/aqua-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  containers:
    name: Validate container images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-application-discovery, backend-application-tests, backend-web-discovery, backend-web-tests, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_ABP_API_URL=https://api.example.test
            NEXT_PUBLIC_DEFAULT_TENANT_NAME=Default
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Production-equivalent regression: runs the Create-and-Invite flow (invitation lifecycle,
  # accept + JWT auth, and transactional rollback atomicity) on a real PostgreSQL service container
  # under a transactional Unit of Work. The default SQLite harness cannot reproduce the
  # transactional visibility defect this guards against, so this job is the authoritative check.
  postgres-transactional-regression:
    name: PostgreSQL transactional invitation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AqualLifeStyle/9.4.2/aspnet-core
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aqual_ci
          POSTGRES_PASSWORD: aqual_ci_tests_only
          POSTGRES_DB: aqual_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqual_ci -d aqual_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      ASPNETCORE_ENVIRONMENT: Development
      REPRO_PG: "true"
      REPRO_TRANSACTIONAL: "true"
      REPRO_PG_CONNECTION: "Host=localhost;Port=5432;Database=aqual_ci;Username=aqual_ci;Password=aqual_ci_tests_only"
      REPRO_MARKER_DIR: ${{ github.workspace }}/AqualLifeStyle/9.4.2/aspnet-core/TestResults
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Confirm reproduction mode is active
        shell: bash
        run: |
          test "$REPRO_PG" = "true"
          test "$REPRO_TRANSACTIONAL" = "true"
          test -n "$REPRO_PG_CONNECTION"
          echo "Reproduction mode active: REPRO_PG=$REPRO_PG REPRO_TRANSACTIONAL=$REPRO_TRANSACTIONAL"
      - name: Verify disposable backup restoration and runtime privilege denials
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:16-alpine
          mkdir -p AqualLifeStyle/9.4.2/aspnet-core/TestResults
          bash tools/deployment/disposable-recovery.sh | tee AqualLifeStyle/9.4.2/aspnet-core/TestResults/disposable-recovery.log
      - name: Restore web tests
        run: dotnet restore test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj
      - name: Build web tests
        run: dotnet build test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj --configuration Release --no-restore
      - name: Run transactional regressions on PostgreSQL
        run: dotnet test test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~InternalAccountInvitation|FullyQualifiedName~WeeklyCommissionPostgreSqlApplicationPathTests|FullyQualifiedName~WeeklyCommissionProductionLikeE2ETests|FullyQualifiedName~AdminCommissionPayoutMutationPostgreSqlTests|(FullyQualifiedName~AQGreenPlacementV2ApprovalPostgreSqlTests&FullyQualifiedName!~D10)|FullyQualifiedName~AQGreenPlacementV2ProgressTests.EnabledV2Progress_RealPostgreSqlB4" --logger "trx;LogFileName=pg-regressions.trx" --results-directory TestResults
      - name: Verify the regressions really ran under PostgreSQL and were not skipped
        shell: bash
        run: |
          set -euo pipefail
          trx="TestResults/pg-regressions.trx"
          test -f "$trx" || { echo "::error::TRX results file not found"; exit 1; }
          grep -qE '<UnitTestResult[^>]*testName="[^"]*InvitationAcceptance_AllowsTokenAuthentication"[^>]*outcome="Passed"' "$trx" \
            || { echo "::error::InvitationAcceptance_AllowsTokenAuthentication did not run and pass"; exit 1; }
          grep -qE '<UnitTestResult[^>]*testName="[^"]*CreateAndInvite_TransactionalRollback_LeavesNoPartialAdministrator"[^>]*outcome="Passed"' "$trx" \
            || { echo "::error::CreateAndInvite_TransactionalRollback_LeavesNoPartialAdministrator did not run and pass (skipped / non-transactional / non-PG path taken)"; exit 1; }
          grep -qE '<UnitTestResult[^>]*testName="[^"]*PostgreSqlApplicationPath_RollsBackThenRetriesIdempotently"[^>]*outcome="Passed"' "$trx" \
            || { echo "::error::weekly commission PostgreSQL application-path retry did not run and pass"; exit 1; }
          grep -qE '<UnitTestResult[^>]*testName="[^"]*QualifiedLevelOneNetwork_WorkerCalculatesLatestClosedWeek_ExactlyOnce"[^>]*outcome="Passed"' "$trx" \
            || { echo "::error::weekly commission production-like E2E did not run and pass"; exit 1; }
          test "$(grep -cE '<UnitTestResult[^>]*testName="[^"]*ConcurrentDifferentPaymentReferences_OnlyOneApplicationCallWins[^"]*"[^>]*outcome="Passed"' "$trx")" -eq 2 \
            || { echo "::error::AQGreen and Onyx payout mutation races did not both run and pass"; exit 1; }
          grep -qE '<UnitTestResult[^>]*testName="[^"]*EnabledV2Approval_CommitsPlacementActivationDecisionRoleAndOutbox_AndRetryIsExact"[^>]*outcome="Passed"' "$trx" \
            || { echo "::error::AQGreen B3.2 PostgreSQL approval integration did not run and pass"; exit 1; }
          grep -qE '<UnitTestResult[^>]*testName="[^"]*EnabledV2Progress_RealPostgreSqlB4MapsSpilloverOccupancySeparatelyFromRecruitment"[^>]*outcome="Passed"' "$trx" \
            || { echo "::error::AQGreen B5.1 PostgreSQL progress integration did not run and pass"; exit 1; }
          # Provenance proof: the rollback test only writes this marker when its transactional+PG body
          # actually executes (i.e. the guard did NOT short-circuit). Its absence means the regression
          # silently took the default non-transactional path and must fail the job.
          test -n "$REPRO_MARKER_DIR"
          test -f "$REPRO_MARKER_DIR/rollback-transactional-pg.ran" \
            || { echo "::error::transactional rollback regression did not execute its PostgreSQL body (default non-transactional path taken - missing marker)"; exit 1; }
          test -f "$REPRO_MARKER_DIR/weekly-commission-application-path-pg.ran" \
            || { echo "::error::weekly commission regression did not execute its PostgreSQL body (missing marker)"; exit 1; }
          test -f "$REPRO_MARKER_DIR/weekly-commission-e2e-pg.ran" \
            || { echo "::error::weekly commission production-like E2E did not execute its PostgreSQL body (missing marker)"; exit 1; }
          test -f "$REPRO_MARKER_DIR/admin-commission-payout-entry-pg.ran" \
            || { echo "::error::AQGreen payout mutation race did not execute its PostgreSQL body (missing marker)"; exit 1; }
          test -f "$REPRO_MARKER_DIR/admin-commission-payout-onyx-pg.ran" \
            || { echo "::error::Onyx payout mutation race did not execute its PostgreSQL body (missing marker)"; exit 1; }
          test -f "$REPRO_MARKER_DIR/aqgreen-v2-progress-pg.ran" \
            || { echo "::error::AQGreen B5.1 progress did not execute its PostgreSQL body (missing marker)"; exit 1; }
          if grep -qE 'outcome="(Failed|Error|Aborted|Skipped|NotExecuted)"' "$trx"; then
            echo "::error::test failures present in the PostgreSQL regression results"
            exit 1
          fi
          echo "PostgreSQL transactional regressions ran and passed (neither skipped); visibility + rollback guarded."
      - name: Run isolated member Area authorization regressions
        env:
          MEMBER_AREA_AUTHORIZATION: "true"
          REPRO_PG_SCHEMA_FROM_MODEL: "true"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:REPRO_PG_CONNECTION = $env:REPRO_PG_CONNECTION.Replace('Host=localhost', 'Host=127.0.0.1').Replace('Database=aqual_ci', 'Database=member_area_authorization_ci')
          dotnet test test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj `
            --configuration Release --no-build `
            --filter FullyQualifiedName~MemberAreaAuthorizationPostgreSqlTests `
            --logger "trx;LogFileName=member-area-pg.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw 'Member authorization execution failed' }
          [xml]$trx = Get-Content TestResults/member-area-pg.trx
          $results = @($trx.SelectNodes('//*[local-name()="UnitTestResult"]'))
          $names = @($results | ForEach-Object { $_.GetAttribute('testName') })
          if ($results.Count -ne 24 -or (@($names | Sort-Object -Unique)).Count -ne 24 -or
              @($results | Where-Object { $_.GetAttribute('outcome') -ne 'Passed' }).Count -ne 0) {
            throw 'Expected all 24 distinct member authorization regressions to pass without skips'
          }
      # Frozen D10 fixtures require a complete, isolated population. Reuse this
      # job's existing PostgreSQL service, with a fresh model-created database.
      - name: Prepare isolated synthetic D10 population
        run: docker exec '${{ job.services.postgres.id }}' createdb -U aqual_ci aqual_d10
      - name: Run isolated D10 cutover and Area regressions
        env:
          REPRO_PG_SCHEMA_FROM_MODEL: "true"
          REPRO_PG_CONNECTION: "Host=localhost;Port=5432;Database=aqual_d10;Username=aqual_ci;Password=aqual_ci_tests_only"
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=aqual_d10;Username=aqual_ci;Password=aqual_ci_tests_only"
        run: dotnet test test/AqualLifeStyle.Web.Tests/AqualLifeStyle.Web.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~D10Cutover_|FullyQualifiedName~D10Area_" --logger "trx;LogFileName=d10-pg-regressions.trx" --results-directory TestResults
      - name: Verify complete D10 PostgreSQL execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = [System.Xml.XmlReaderSettings]::new()
          $settings.DtdProcessing = [System.Xml.DtdProcessing]::Prohibit
          $reader = [System.Xml.XmlReader]::Create('TestResults/d10-pg-regressions.trx', $settings)
          $trx = [System.Xml.XmlDocument]::new()
          try { $trx.Load($reader) } finally { $reader.Dispose() }
          $results = @($trx.SelectNodes("/*[local-name()='TestRun']/*[local-name()='Results']/*[local-name()='UnitTestResult']"))
          $actual = @($results | ForEach-Object { $_.GetAttribute('testName') })
          if ($results.Count -ne 14 -or (@($actual | Sort-Object -Unique)).Count -ne 14 -or
              @($results | Where-Object { $_.GetAttribute('outcome') -ne 'Passed' }).Count -ne 0 -or
              @($actual | Where-Object { $_ -like '*D10Cutover_*' }).Count -ne 5 -or
              @($actual | Where-Object { $_ -like '*D10Area_*' }).Count -ne 9) {
            throw 'D10 PostgreSQL population tests were missing, duplicated, skipped or failed'
          }
          Write-Output 'PASS: all 14 isolated D10 PostgreSQL cases executed and passed.'
      - name: Upload PostgreSQL regression results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pg-regression-test-results
          path: AqualLifeStyle/9.4.2/aspnet-core/TestResults
          if-no-files-found: ignore
          retention-days: 7
