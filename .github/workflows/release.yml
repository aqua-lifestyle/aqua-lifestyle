name: Automatic deployment trigger

on:
  workflow_run:
    workflows: ["Continuous integration"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  trigger:
    name: Dispatch qualified executor
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      # Installed ONLY on aqua-deployment: Actions:write and Metadata:read.
      # No Contents/Workflows/Admin/Secrets write and no provider authority.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: trigger-token
        with:
          app-id: ${{ vars.DEPLOYMENT_TRIGGER_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_TRIGGER_APP_PRIVATE_KEY }}
          owner: aqua-lifestyle
          repositories: aqua-deployment
          permission-actions: write
      - name: Automatically dispatch qualified source hints
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTOR_TRIGGER_TOKEN: ${{ steps.trigger-token.outputs.token }}
        run: node tools/deployment/trigger-executor.mjs
