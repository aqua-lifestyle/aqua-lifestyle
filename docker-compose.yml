name: aqualifestyle

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqualifestyle}
      POSTGRES_USER: ${POSTGRES_USER:-aqualifestyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - aqualifestyle-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - aqualifestyle-network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: ["dotnet", "migrator/AqualLifeStyle.Migrator.dll", "-q"]
    entrypoint: []
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aqualifestyle};Username=${POSTGRES_USER:-aqualifestyle};Password=${POSTGRES_PASSWORD};
      Redis__Configuration: redis:6379
      Redis__DatabaseId: 0
      App__ServerRootAddress: http://localhost:21021/
      App__ClientRootAddress: http://localhost:3000/
      App__CorsOrigins: http://localhost:3000
      App__DefaultTenantName: ${DEFAULT_AREA_NAME:-Default}
      Authentication__JwtBearer__IsEnabled: "true"
      Authentication__JwtBearer__SecurityKey: ${JWT_SECURITY_KEY:?Set JWT_SECURITY_KEY in .env}
      Authentication__JwtBearer__Issuer: ${JWT_ISSUER:-AqualLifeStyle}
      Authentication__JwtBearer__Audience: ${JWT_AUDIENCE:-AqualLifeStyle}
      DataProtection__CertificateBase64: ${DATA_PROTECTION_CERTIFICATE_BASE64:?Set DATA_PROTECTION_CERTIFICATE_BASE64 in .env}
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?Set DATA_PROTECTION_CERTIFICATE_PASSWORD in .env}
      DataProtection__PreviousCertificateBase64: ${DATA_PROTECTION_PREVIOUS_CERTIFICATE_BASE64:-}
      DataProtection__PreviousCertificatePassword: ${DATA_PROTECTION_PREVIOUS_CERTIFICATE_PASSWORD:-}
      Yoco__SecretKey: ${YOCO_SECRET_KEY:?Set YOCO_SECRET_KEY in .env}
      Yoco__WebhookSecret: ${YOCO_WEBHOOK_SECRET:?Set YOCO_WEBHOOK_SECRET in .env}
      Yoco__Mode: ${YOCO_MODE:-test}
      Bird__Enabled: ${BIRD_ENABLED:-false}
      Bird__ApiKey: ${BIRD_API_KEY:-}
      Bird__FromEmail: ${BIRD_FROM_EMAIL:-}
      Bird__FromName: ${BIRD_FROM_NAME:-Aqua Lifestyle Club}
      Bird__ReplyToEmail: ${BIRD_REPLY_TO_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqualifestyle-network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment: *api-environment
    ports:
      - "21021:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - aqualifestyle-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_ABP_API_URL: ${NEXT_PUBLIC_ABP_API_URL:-http://localhost:21021}
        NEXT_PUBLIC_DEFAULT_TENANT_NAME: ${DEFAULT_AREA_NAME:-Default}
        NEXT_PUBLIC_MONITORING_ENDPOINT: ${NEXT_PUBLIC_MONITORING_ENDPOINT:-}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aqualifestyle-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  aqualifestyle-network:
    name: aqualifestyle-network
    driver: bridge
